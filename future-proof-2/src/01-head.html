<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="An interactive unit for ages 11 to 14 about computer systems: where we are, where we've been and where we might go. Ends with a pitch sealed in a time capsule.">
<title>Future Proof 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&family=VT323&display=swap">
<style>
/* Future Proof 2. Same page model as The Data Trail v3: each mission is a .view, the address (#m3, #toptrumps…) picks the view.
   Eras: --then (amber, the past), --now (violet, today), --next (cyan, the future). --inv stays dark in both themes. */
:root{
  --bg:#F3F0E8; --paper:#FFFFFF; --ink:#191A2C; --muted:#585A6E; --line:#C9C4B7; --ctl:#7A7C8E;
  --inv:#15162A; --on-inv:#F3F0E8;
  --then:#FFB627; --then-ink:#191A2C; --then-soft:#FFF0CC;
  --now:#6B3FD4; --now-soft:#ECE5FB;
  --next:#0B7A8A; --next-soft:#D7F0F2;
  --hi:#FFB627; --hi-ink:#191A2C;
  --good:#1E7A44; --good-soft:#DDF2E4; --bad:#B23A1C; --bad-soft:#F8E1DA; --mid:#8A5A00; --mid-soft:#FBEBCB;
  --display:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --pix:"VT323",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1020; --paper:#1A1B30; --ink:#ECEBF5; --muted:#A3A4B8; --line:#33354F; --ctl:#6E7090;
  --inv:#08081A; --on-inv:#ECEBF5;
  --then-soft:#3A2D10; --now:#A98BFF; --now-soft:#2A2148; --next:#4FD1E0; --next-soft:#123A40;
  --good:#5BC98A; --good-soft:#163525; --bad:#F08A6C; --bad-soft:#3D2018; --mid:#F2C46A; --mid-soft:#3A2D10; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1020; --paper:#1A1B30; --ink:#ECEBF5; --muted:#A3A4B8; --line:#33354F; --ctl:#6E7090;
  --inv:#08081A; --on-inv:#ECEBF5;
  --then-soft:#3A2D10; --now:#A98BFF; --now-soft:#2A2148; --next:#4FD1E0; --next-soft:#123A40;
  --good:#5BC98A; --good-soft:#163525; --bad:#F08A6C; --bad-soft:#3D2018; --mid:#F2C46A; --mid-soft:#3A2D10; color-scheme:dark}

*{box-sizing:border-box}
html.big{font-size:20px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:1.0625rem;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--inv)}
img{max-width:100%}
[hidden]{display:none!important}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);line-height:1.08;text-wrap:balance;margin:0}
h2{font-size:clamp(1.7rem,4.5vw,2.4rem);font-weight:800;letter-spacing:-.01em}
h3{font-size:1.2rem;font-weight:700}
p{margin:0}
ul,ol{margin:0;padding-left:1.25em}
a{color:var(--now)}
.prose{display:grid;gap:12px;max-width:68ch}
.lede{color:var(--muted);max-width:64ch}
.small{font-size:.86rem;color:var(--muted)}
.mono{font-family:var(--mono)}
.mark{background:linear-gradient(transparent 12%,var(--hi) 12%,var(--hi) 88%,transparent 88%);color:var(--hi-ink);padding:0 .2em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.eyebrow{font-family:var(--mono);font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--now);font-weight:600}
button{font:inherit;cursor:pointer;color:inherit}
input,select,textarea{font:inherit;color:var(--ink);background:var(--paper);border:1.5px solid var(--ctl);border-radius:8px;padding:8px 10px;max-width:100%}
textarea{width:100%;min-height:84px;resize:vertical}
label{font-weight:700;font-size:.95rem}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--now);outline-offset:2px}
nav.top :focus-visible,.part :focus-visible,.partend .next:focus-visible{outline-color:var(--then)}
[tabindex="-1"]:focus{outline:none}
[id]{scroll-margin-top:72px}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{position:absolute;left:12px;top:-80px;z-index:20;background:var(--hi);color:var(--hi-ink);padding:10px 14px;border-radius:8px;font-weight:700;text-decoration:none}
.skip:focus{top:calc(env(safe-area-inset-top,0px) + 8px)}

/* top nav */
nav.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--inv);color:var(--on-inv);border-bottom:1px solid color-mix(in srgb,var(--on-inv) 16%,transparent)}
nav.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
nav.top .brand{font-family:var(--display);font-weight:800;white-space:nowrap;color:var(--on-inv);text-decoration:none;font-size:1rem}
nav.top .links{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;min-width:0;flex:1}
nav.top .links.more{-webkit-mask:linear-gradient(90deg,#000 calc(100% - 36px),transparent);mask:linear-gradient(90deg,#000 calc(100% - 36px),transparent)}
nav.top .links::-webkit-scrollbar{display:none}
nav.top .links a{color:var(--on-inv);text-decoration:none;font-size:.86rem;padding:6px 10px;border-radius:99px;white-space:nowrap;opacity:.85;display:flex;align-items:center;gap:6px}
nav.top .links a::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--era,var(--then));flex:none}
nav.top .links a.e-now{--era:var(--now)} nav.top .links a.e-next{--era:var(--next)}
nav.top .links a:hover{opacity:1;background:color-mix(in srgb,var(--on-inv) 14%,transparent)}
nav.top .links a[aria-current="page"]{opacity:1;font-weight:700;background:color-mix(in srgb,var(--on-inv) 18%,transparent)}
.navbtn{flex:none;background:transparent;color:var(--on-inv);border:1.5px solid color-mix(in srgb,var(--on-inv) 50%,transparent);border-radius:99px;padding:5px 12px;font-size:.85rem;font-weight:700;white-space:nowrap}
.navbtn[aria-pressed="true"]{background:var(--on-inv);color:var(--inv);border-color:var(--on-inv)}
.navbtn.pass{background:var(--then);color:var(--then-ink);border-color:var(--then)}
.navbtn .count{font-family:var(--mono);margin-left:4px}
.navbtn .sm{display:none}

/* hero */
.hero{padding-block:44px 40px}
.hero-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:36px;align-items:center}
.hero h1{font-size:clamp(2.4rem,7.5vw,4.8rem);font-weight:800;letter-spacing:-.025em}
.hero .lede{font-size:1.15rem;margin-top:18px}
.hero .meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.chip{font-family:var(--mono);font-size:.78rem;border:1px solid var(--line);border-radius:99px;padding:4px 10px;background:var(--paper);color:var(--muted)}
.vs{display:grid;gap:10px}
.vs .card{background:var(--inv);color:var(--on-inv);border-radius:12px;padding:16px 18px;font-family:var(--mono);font-size:.84rem;box-shadow:0 12px 30px -18px rgba(0,0,0,.6)}
.vs .card .yr{font-family:var(--pix);font-size:1.9rem;line-height:1;color:var(--then)}
.vs .card.now .yr{color:var(--next)}
.vs .card .row{display:flex;justify-content:space-between;gap:12px;padding:2px 0;border-bottom:1px dashed color-mix(in srgb,var(--on-inv) 20%,transparent)}
.vs .card .row:last-child{border:0}
.vs .card .row span:last-child{font-weight:600;text-align:right}
.vs .x{font-family:var(--pix);font-size:1.4rem;text-align:center;color:var(--muted)}

/* route */
.route-head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin-top:34px}
.route{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px}
.route a{display:grid;gap:3px;text-decoration:none;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-top:5px solid var(--era,var(--then));border-radius:8px;padding:10px;font-size:.84rem;position:relative}
.route a:hover{border-color:var(--ink);border-top-color:var(--era,var(--then))}
.route a b{font-family:var(--display);font-size:.98rem}
.route a span{font-family:var(--mono);font-size:.72rem;color:var(--muted);letter-spacing:.06em}
.route a.e-now{--era:var(--now)} .route a.e-next{--era:var(--next)}
.route a .done{position:absolute;top:8px;right:8px;font-family:var(--pix);font-size:1rem;color:var(--good)}
.eras{display:flex;gap:14px;flex-wrap:wrap;font-family:var(--mono);font-size:.78rem;color:var(--muted)}
.eras i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}

/* mission bands, sections */
.part{background:var(--inv);color:var(--on-inv);position:relative;overflow:hidden}
.part::after{content:"";position:absolute;inset:auto 0 0;height:6px;background:var(--era,var(--then))}
.part.e-now{--era:var(--now)} .part.e-next{--era:var(--next)}
.part .wrap{padding-block:38px 44px;display:grid;gap:10px;position:relative}
.part .num{font-family:var(--pix);font-size:1.35rem;letter-spacing:.06em;color:var(--era,var(--then))}
.part.e-now .num{color:#B9A2FF}
.part.e-next .num{color:#6FE3F0}
.part h1{font-family:var(--display);font-size:clamp(1.9rem,5vw,2.8rem);font-weight:800;letter-spacing:-.015em;color:var(--on-inv)}
.part p{color:color-mix(in srgb,var(--on-inv) 82%,var(--inv));max-width:62ch}
.part .goals{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.part .goals span{font-size:.82rem;border:1px solid color-mix(in srgb,var(--on-inv) 30%,transparent);border-radius:99px;padding:3px 10px;color:var(--on-inv)}
section.block{padding-block:44px;border-top:1px solid var(--line)}
section.block.first{border-top:0}
.sec-head{display:grid;gap:10px;margin-bottom:22px}
.mission{font-family:var(--mono);font-size:.78rem;color:var(--muted);letter-spacing:.04em}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:18px}
.panel h3{margin-bottom:10px;font-size:1.05rem}
.task{border-left:5px solid var(--then);padding:10px 14px;background:var(--paper);border-radius:0 8px 8px 0;margin-top:20px;max-width:75ch}
.task b{font-family:var(--display)}
.note{border:1px dashed var(--ctl);border-radius:10px;padding:10px 14px;font-size:.92rem;color:var(--muted);max-width:75ch}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.grid-auto{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:grid;gap:10px}
.mt{margin-top:16px}.mt2{margin-top:28px}

.btn{border:1.5px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:8px;padding:9px 14px;font-weight:700;font-size:.95rem;text-decoration:none;display:inline-block;min-height:42px}
@media (hover:hover){.btn:hover{background:var(--hi);color:var(--hi-ink);border-color:var(--hi-ink)}}
.btn.primary{background:var(--ink);color:var(--bg)}
@media (hover:hover){.btn.primary:hover{background:var(--hi);color:var(--hi-ink)}}
.btn.sm{padding:5px 10px;font-size:.85rem;min-height:34px}
.btn[aria-pressed="true"]{background:var(--now);border-color:var(--now);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--paper);padding:7px 12px;font-weight:700;font-size:.9rem;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* feedback */
.fb{margin-top:10px;padding:10px 12px;border-radius:8px;font-size:.95rem}
.fb.ok{background:var(--good-soft);color:var(--ink);border-left:5px solid var(--good)}
.fb.no{background:var(--bad-soft);color:var(--ink);border-left:5px solid var(--bad)}
.fb.mid{background:var(--mid-soft);color:var(--ink);border-left:5px solid var(--mid)}
.tag{display:inline-block;font-family:var(--mono);font-size:.72rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:99px;border:1px solid currentColor}
.tag.ok{color:var(--good)} .tag.no{color:var(--bad)} .tag.mid{color:var(--mid)} .tag.now{color:var(--now)} .tag.next{color:var(--next)}

/* sort cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.scard{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px;align-content:start}
.scard .who{font-family:var(--mono);font-size:.76rem;color:var(--muted)}
.scard .q{font-family:var(--display);font-weight:700;font-size:1.05rem;line-height:1.25}
.scard .opts{display:flex;flex-wrap:wrap;gap:6px}
.scard .opts button{border:1.5px solid var(--ctl);background:var(--paper);border-radius:99px;padding:5px 11px;font-size:.86rem;font-weight:700}
.scard .opts button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.scard.right{border-color:var(--good);box-shadow:inset 0 0 0 1px var(--good)}
.scard.wrong{border-color:var(--bad)}
.score{font-family:var(--pix);font-size:1.6rem;line-height:1}

/* classify (tap item, tap bin) */
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:48px;padding:10px;border:1.5px dashed var(--ctl);border-radius:10px}
.item{border:1.5px solid var(--ink);background:var(--paper);border-radius:8px;padding:7px 11px;font-weight:700;font-size:.92rem}
.item[aria-pressed="true"]{background:var(--then);color:var(--then-ink);border-color:var(--then-ink)}
.item.ok{border-color:var(--good);background:var(--good-soft)}
.item.no{border-color:var(--bad);background:var(--bad-soft)}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:12px}
.bin{background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:10px;min-height:120px;display:grid;align-content:start;gap:6px;text-align:left}
.bin>b{font-family:var(--display);font-size:1rem}
.bin>span{font-size:.8rem;color:var(--muted)}
.bin .in{display:flex;flex-wrap:wrap;gap:6px}
.bin.target{border-color:var(--now);border-style:dashed;cursor:pointer}

/* desk simulator */
.desk{display:grid;grid-template-columns:repeat(var(--slots,4),minmax(0,1fr));gap:6px;padding:10px;background:var(--then-soft);border-radius:10px;border:1px solid var(--line)}
.slot{min-height:54px;border:1.5px dashed var(--ctl);border-radius:8px;display:grid;place-items:center;font-size:.8rem;font-weight:700;text-align:center;padding:4px;background:var(--paper)}
.slot.full{border-style:solid;border-color:var(--ink);background:var(--paper)}
.slot.hot{background:var(--now-soft);border-color:var(--now)}
.meter{height:12px;border-radius:99px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--now);width:0;transition:width .4s}
.big-num{font-family:var(--pix);font-size:2.4rem;line-height:1}
.log{font-family:var(--mono);font-size:.8rem;background:var(--inv);color:var(--on-inv);border-radius:10px;padding:10px 12px;max-height:200px;overflow:auto;display:grid;gap:3px}
.log .w{color:#FFB627} .log .g{color:#7DE0A0} .log .b{color:#FF9C84} .log .c{color:#6FE3F0}

/* CPU */
.cpu{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mem{display:grid;grid-template-columns:auto 1fr;font-family:var(--mono);font-size:.86rem;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.mem div{padding:5px 8px;border-bottom:1px solid var(--line)}
.mem .addr{background:var(--bg);color:var(--muted)}
.mem .pc{background:var(--then-soft);font-weight:700}
.regs{display:grid;gap:8px}
.reg{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--paper)}
.reg b{font-family:var(--mono)}
.stage{display:flex;gap:6px}
.stage span{flex:1;text-align:center;padding:6px;border-radius:6px;background:var(--bg);font-weight:700;font-size:.85rem;border:1px solid var(--line)}
.stage span.on{background:var(--now);color:#fff;border-color:var(--now)}

/* binary */
.bits{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
.bit{border:2px solid var(--ink);border-radius:10px;background:var(--paper);padding:8px 2px;display:grid;gap:4px;justify-items:center}
.bit .v{font-family:var(--mono);font-size:.75rem;color:var(--muted)}
.bit .d{font-family:var(--pix);font-size:2.2rem;line-height:1}
.bit[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.bit[aria-pressed="true"] .v{color:var(--bg)}
.outs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.outs .o{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.outs .o b{display:block;font-family:var(--pix);font-size:2rem;line-height:1.1}
.swatch{width:48px;height:32px;border-radius:6px;border:1px solid var(--line);margin:4px auto 0}

/* top trumps */
.tt{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:start}
.tcard{background:var(--inv);color:var(--on-inv);border-radius:14px;padding:16px;min-height:300px;display:grid;gap:8px;align-content:start;border:3px solid var(--then)}
.tcard.cpu-card{border-color:var(--now)}
.tcard h3{color:var(--on-inv);font-size:1.15rem}
.tcard .yr{font-family:var(--pix);font-size:1.4rem;color:var(--then)}
.tcard .stat{display:flex;justify-content:space-between;gap:10px;width:100%;background:transparent;color:var(--on-inv);border:1px solid color-mix(in srgb,var(--on-inv) 25%,transparent);border-radius:8px;padding:8px 10px;font-weight:700;text-align:left}
.tcard .stat span:last-child{font-family:var(--mono)}
.tcard button.stat:hover{background:color-mix(in srgb,var(--on-inv) 14%,transparent)}
.tcard .stat.win{background:var(--good);border-color:var(--good);color:#fff}
.tcard .stat.lose{background:var(--bad);border-color:var(--bad);color:#fff}
.tcard .fact{font-size:.85rem;opacity:.85}
.tcard.back{display:grid;place-items:center;background:repeating-linear-gradient(45deg,var(--inv),var(--inv) 10px,#23244a 10px,#23244a 20px)}
.tt .mid{display:grid;gap:10px;justify-items:center;padding-top:40px;text-align:center}

/* table */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--paper)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-family:var(--mono);font-size:.76rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);background:var(--bg);white-space:nowrap}
th button{background:none;border:0;font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit;padding:0;cursor:pointer}
td.num{font-family:var(--mono);text-align:right;white-space:nowrap}
tr.flag td{background:var(--mid-soft)}
tr.fixed td{background:var(--good-soft)}

/* race */
.race{display:grid;gap:10px}
.lane{display:grid;grid-template-columns:150px 1fr 80px;gap:10px;align-items:center;font-size:.9rem}
.track{height:26px;background:var(--bg);border:1px solid var(--line);border-radius:6px;overflow:hidden;position:relative}
.track i{position:absolute;inset:0 auto 0 0;width:0;background:var(--now);border-radius:6px}
.lane .t{font-family:var(--mono);text-align:right}

/* ladder */
.ladder{display:grid;gap:6px}
.rung{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.rung .pos{font-family:var(--pix);font-size:1.5rem;text-align:center}
.rung .ctl{display:flex;gap:4px}
.rung .ctl button{border:1.5px solid var(--ctl);background:var(--paper);border-radius:6px;width:36px;height:36px;font-weight:700}

/* tomorrow's world clip cards */
.clip{background:var(--inv);color:var(--on-inv);border-radius:12px;overflow:hidden;display:grid}
.clip .scr{aspect-ratio:4/3;background:radial-gradient(circle at 50% 45%,#2b2d55,#0a0a18 75%);display:grid;place-items:center;position:relative;font-family:var(--pix);font-size:2.6rem;color:var(--then);text-shadow:0 0 12px rgba(255,182,39,.6)}
.clip .scr::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.04) 0 2px,transparent 2px 4px);pointer-events:none}
.clip .scr small{position:absolute;bottom:8px;left:10px;font-size:1rem;color:var(--on-inv);opacity:.7;text-shadow:none}
.clip .body{padding:12px 14px;display:grid;gap:8px}
.clip .body p{font-size:.92rem;color:color-mix(in srgb,var(--on-inv) 85%,var(--inv))}
.clip .opts{display:flex;gap:6px;flex-wrap:wrap}
.clip .opts button{background:transparent;border:1.5px solid color-mix(in srgb,var(--on-inv) 50%,transparent);color:var(--on-inv);border-radius:99px;padding:4px 10px;font-weight:700;font-size:.85rem}
.clip .opts button[aria-pressed="true"]{background:var(--then);color:var(--then-ink);border-color:var(--then)}
.clip .res{font-size:.9rem;border-top:1px dashed color-mix(in srgb,var(--on-inv) 30%,transparent);padding-top:8px}

/* advert studio */
.ad-studio{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:20px;align-items:start}
.poster{background:#0B0B0B;color:#fff;border-radius:6px;padding:24px 22px 18px;position:relative;overflow:hidden;font-family:var(--body);min-height:520px;display:grid;align-content:start;gap:12px;box-shadow:0 18px 40px -20px rgba(0,0,0,.7)}
.poster.st-white{background:#FAF7EE;color:#111}
.poster.st-neon{background:linear-gradient(180deg,#120428 0%,#2a0845 55%,#ff2e88 100%);}
.poster .stripe{position:absolute;right:-40px;top:22px;width:180px;height:90px;transform:rotate(-12deg);background:repeating-linear-gradient(180deg,#FF3B30 0 14px,#FF9500 14px 28px,#FFCC00 28px 42px,#34C759 42px 56px,#0A84FF 56px 70px);opacity:.92}
.poster.st-neon .stripe{background:repeating-linear-gradient(90deg,transparent 0 22px,rgba(0,255,255,.6) 22px 24px);height:200px;top:auto;bottom:0;right:0;left:0;width:auto;transform:perspective(200px) rotateX(55deg);transform-origin:bottom}
.poster .p-head{font-family:var(--display);font-weight:800;font-size:clamp(1.6rem,3.6vw,2.4rem);line-height:.95;letter-spacing:-.02em;position:relative;max-width:68%;text-transform:uppercase;z-index:1}
.poster.st-neon .p-head{color:#fff;text-shadow:0 0 10px #ff2e88,0 0 22px #ff2e88}
.poster .p-name{font-family:var(--pix);font-size:2.2rem;line-height:1;color:#FFCC00;position:relative}
.poster.st-white .p-name{color:#C1121F}
.poster .p-specs{list-style:none;padding:0;display:grid;gap:4px;font-family:var(--mono);font-size:.88rem;position:relative}
.poster .p-specs li::before{content:"\25B8  ";color:#FFCC00}
.poster.st-white .p-specs li::before{color:#C1121F}
.poster .p-burst{position:absolute;right:18px;bottom:110px;width:120px;height:120px;background:#FFCC00;color:#111;display:grid;place-items:center;text-align:center;font-family:var(--display);font-weight:800;font-size:1.25rem;line-height:1;clip-path:polygon(50% 0,61% 18%,82% 9%,80% 31%,100% 38%,85% 54%,98% 72%,77% 76%,74% 98%,56% 85%,38% 100%,32% 79%,10% 82%,17% 61%,0 48%,18% 36%,9% 15%,31% 18%);padding:16px}
.poster .p-slogan{font-family:var(--display);font-style:italic;font-size:1.1rem;position:relative;max-width:62%}
.poster .p-coupon{border:2px dashed currentColor;padding:8px 10px;font-family:var(--mono);font-size:.74rem;display:grid;gap:4px;max-width:62%;position:relative;margin-top:auto}
.poster .p-coupon .ln{border-bottom:1px solid currentColor;height:14px;opacity:.6}
.poster .p-small{font-size:.7rem;opacity:.8;position:relative}
.checklist{list-style:none;padding:0;display:grid;gap:6px}
.checklist li{display:flex;gap:8px;align-items:flex-start;font-size:.94rem}
.checklist li::before{content:"\25CB";font-weight:700;color:var(--muted)}
.checklist li.ok::before{content:"\2714";color:var(--good)}
.checklist li.no::before{content:"\2716";color:var(--bad)}

/* network */
.net svg{width:100%;height:auto;display:block;background:var(--paper);border:1px solid var(--line);border-radius:12px}
.net .node circle{fill:var(--paper);stroke:var(--ink);stroke-width:2}
.net .node.router circle{fill:var(--now-soft);stroke:var(--now)}
.net .node.end circle{fill:var(--then-soft);stroke:var(--then-ink)}
.net .node.down circle{fill:var(--bad-soft);stroke:var(--bad)}
.net .node text{font-family:var(--mono);font-size:11px;fill:var(--ink);text-anchor:middle}
.net line.link{stroke:var(--ctl);stroke-width:3}
.net line.link.down{stroke:var(--bad);stroke-dasharray:6 5}
.net .pkt rect{fill:var(--then);stroke:var(--then-ink);stroke-width:1.5}
.net .pkt text{font-family:var(--mono);font-size:10px;fill:var(--then-ink);text-anchor:middle;font-weight:700}
.pkts{display:flex;flex-wrap:wrap;gap:6px}
.pk{font-family:var(--mono);font-size:.78rem;border:1.5px solid var(--ink);border-radius:6px;padding:4px 8px;background:var(--paper)}
.pk b{color:var(--now)}
.pk.lost{border-color:var(--bad);color:var(--bad);text-decoration:line-through}
.pk.got{border-color:var(--good);background:var(--good-soft)}

/* timeline */
.tl{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.tl button{flex:none;border:1.5px solid var(--ink);background:var(--paper);border-radius:8px;padding:8px 12px;font-family:var(--pix);font-size:1.4rem;line-height:1}
.tl button[aria-pressed="true"]{background:var(--now);color:#fff;border-color:var(--now)}
.tl-card{margin-top:12px;min-height:120px}

/* micro:bit sim */
.mbs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.mb{background:#1F2430;color:#fff;border-radius:16px;padding:12px;display:grid;gap:10px;justify-items:center;position:relative}
.mb .lbl{font-family:var(--mono);font-size:.76rem;opacity:.85}
.mb.off{opacity:.55}
.leds{display:grid;grid-template-columns:repeat(5,14px);gap:7px;padding:10px;background:#111;border-radius:8px}
.led{width:14px;height:14px;border-radius:3px;background:#3a1010}
.led.on{background:#FF3B30;box-shadow:0 0 8px #FF3B30}
.mb .btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.mb .btns button{width:44px;height:44px;border-radius:50%;border:2px solid #fff;background:#3b4150;color:#fff;font-weight:700}
.mb .btns button.wide{width:auto;border-radius:99px;padding:0 12px}
.mb .scr-text{font-family:var(--pix);font-size:1.5rem;min-height:1.5em;color:#FF6B60}
.mb input[type=range]{width:100%}
.levels{display:flex;gap:6px;flex-wrap:wrap}
.code{font-family:var(--mono);font-size:.82rem;background:var(--inv);color:#E7E7F3;border-radius:10px;padding:12px 14px;overflow-x:auto;white-space:pre;line-height:1.5;margin:0}
.code .k{color:#C3A6FF} .code .s{color:#FFD27A} .code .c{color:#8A8CA8;font-style:italic} .code .n{color:#7DE0E9}
details.step{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:0}
details.step summary{cursor:pointer;padding:12px 14px;font-weight:700;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
details.step summary::-webkit-details-marker{display:none}
details.step summary::before{content:"+";font-family:var(--mono);width:22px;height:22px;display:grid;place-items:center;border:1.5px solid var(--ink);border-radius:6px;flex:none}
details.step[open] summary::before{content:"\2212"}
details.step .inner{padding:0 14px 14px;display:grid;gap:10px}
.hw{font-family:var(--mono);font-size:.72rem;padding:2px 8px;border-radius:99px;background:var(--next-soft);color:var(--ink)}
.hw.real{background:var(--then-soft)}

/* charts */
.chart{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px}
.chart svg{width:100%;height:auto;display:block}
.chart text{font-family:var(--mono);font-size:11px;fill:var(--muted)}
.chart .ax{stroke:var(--ctl)}
.chart .grid{stroke:var(--line);stroke-dasharray:3 4}
.chart .pt{fill:var(--now)}
.chart .pt2{fill:var(--then);stroke:var(--then-ink)}
.chart .ln{fill:none;stroke:var(--now);stroke-width:2}
.chart .ln2{fill:none;stroke:var(--then);stroke-width:2.5}
.chart .guess{fill:var(--next);stroke:var(--ink);stroke-width:1.5}

/* trends */
.trend{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.trend .t{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:8px;align-content:start}
.trend .t .ic{font-family:var(--pix);font-size:2rem;line-height:1;color:var(--next)}
.trend .t .then{font-size:.86rem;color:var(--muted)}
.trend .t .now{font-weight:700}
.trend .t .x{font-family:var(--pix);font-size:1.6rem;color:var(--now)}
.duel{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:stretch}
.duel button{border:2px solid var(--ink);background:var(--paper);border-radius:12px;padding:16px;font-family:var(--display);font-weight:800;font-size:1.15rem;min-height:90px}
@media (hover:hover){.duel button:hover{background:var(--next-soft)}}
.duel .or{font-family:var(--pix);font-size:1.6rem;align-self:center}
.rank{display:grid;gap:6px}
.rank div{display:grid;grid-template-columns:28px 1fr 60px;gap:8px;align-items:center;font-size:.92rem}
.rank .bar{height:10px;border-radius:99px;background:var(--next)}

/* frontier files */
.ff-tabs{display:flex;gap:6px;flex-wrap:wrap}
.ff-tabs button{border:1.5px solid var(--ink);background:var(--paper);border-radius:99px;padding:6px 12px;font-weight:700;font-size:.88rem}
.ff-tabs button[aria-selected="true"]{background:var(--next);border-color:var(--next);color:#fff}
.file{background:var(--paper);border:1px solid var(--line);border-top:6px solid var(--next);border-radius:12px;padding:20px;margin-top:14px;display:grid;gap:14px}
.file .hook{font-family:var(--display);font-weight:800;font-size:clamp(1.3rem,3vw,1.7rem);line-height:1.15}
.file .cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.file .box{border-radius:10px;padding:12px;background:var(--bg)}
.file .box h4{margin:0 0 6px;font-family:var(--mono);font-size:.76rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.file .box ul{display:grid;gap:4px;font-size:.93rem}
.file .box.hype{background:var(--mid-soft)}
.file .box.scot{background:var(--next-soft)}
.file .box.should{background:var(--now-soft)}
.file .src{font-size:.78rem;color:var(--muted)}

/* futures cone */
.cone svg{width:100%;height:auto;display:block}
.cone .band{cursor:pointer;stroke:var(--ink);stroke-width:1.5}
.cone .band:focus-visible{outline:none;stroke-width:4;stroke:var(--now)}
.cone text{font-family:var(--display);font-weight:700;font-size:15px;fill:var(--ink);pointer-events:none}
.drawn{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.dcard{background:var(--inv);color:var(--on-inv);border-radius:12px;padding:12px;min-height:110px;display:grid;gap:6px;align-content:start}
.dcard span{font-family:var(--mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:#6FE3F0}
.dcard b{font-family:var(--display);font-size:1.1rem}
.wheel{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.wheel .centre{grid-column:1/-1;text-align:center;background:var(--next);color:#fff;border-radius:12px;padding:12px;font-family:var(--display);font-weight:800}

/* rubric */
.rub{display:grid;gap:8px}
.rub .r{display:grid;grid-template-columns:minmax(0,1.2fr) repeat(3,minmax(0,1fr));gap:6px;align-items:stretch}
.rub .r>div:first-child{font-weight:700;font-size:.92rem;padding:6px 0}
.rub .r button{border:1.5px solid var(--ctl);background:var(--paper);border-radius:8px;padding:6px;font-size:.8rem;text-align:left}
.rub .r button[aria-pressed="true"]{background:var(--next-soft);border-color:var(--next);font-weight:700}
.timer{font-family:var(--pix);font-size:3rem;line-height:1}

/* capsule */
.capsule{background:linear-gradient(160deg,var(--inv),#23244a);color:var(--on-inv);border-radius:18px;padding:22px;display:grid;gap:14px}
.capsule label{color:var(--on-inv)}
.capsule input,.capsule textarea,.capsule select{background:#10112a;color:var(--on-inv);border-color:#55577a}
.capsule .small{color:#B7B8CF}
.sealed{font-family:var(--pix);font-size:1.6rem;color:#7DE0A0}
.rules{display:flex;flex-wrap:wrap;gap:6px}
.rules span{font-size:.82rem;border:1px solid #ff9c84;color:#ffb9a8;border-radius:99px;padding:3px 10px}

/* stamps / pass */
dialog.pass{border:0;border-radius:16px;padding:0;max-width:640px;width:calc(100% - 24px);background:var(--paper);color:var(--ink)}
dialog.pass::backdrop{background:rgba(10,10,25,.6)}
.pass-in{padding:20px;display:grid;gap:14px}
.pass-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.stamps{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.stamp{border:2px dashed var(--line);border-radius:12px;padding:10px;text-align:center;display:grid;gap:4px;min-height:100px;align-content:center;color:var(--muted)}
.stamp .ic{font-family:var(--pix);font-size:1.8rem;line-height:1}
.stamp b{font-size:.84rem;color:var(--ink)}
.stamp span{font-size:.72rem}
.stamp.got{border:2px solid var(--now);color:var(--now);background:var(--now-soft);transform:rotate(-2deg)}
.stamp.got:nth-child(even){transform:rotate(2deg)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(calc(100% + 40px));visibility:hidden;background:var(--inv);color:var(--on-inv);border:2px solid var(--then);border-radius:12px;padding:10px 16px;z-index:30;font-weight:700;transition:transform .3s;max-width:calc(100% - 24px);display:flex;gap:10px;align-items:center}
.toast.show{transform:translateX(-50%) translateY(0);visibility:visible}
.toast .ic{font-family:var(--pix);font-size:1.6rem;color:var(--then)}

/* mission end */
nav.partend{background:var(--inv);color:var(--on-inv)}
nav.partend .wrap{padding-block:30px;display:grid;gap:12px}
.pe-title{font-family:var(--pix);font-size:1.5rem;color:var(--then)}
.pe-check{display:grid;gap:4px;font-size:.95rem}
.pe-check label{font-weight:400;display:flex;gap:8px;align-items:flex-start;color:var(--on-inv)}
.pe-check input{width:20px;height:20px;flex:none;margin-top:2px;accent-color:var(--then)}
.pe-links{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pe-link{display:grid;gap:2px;text-decoration:none;color:var(--on-inv);border:1.5px solid color-mix(in srgb,var(--on-inv) 35%,transparent);border-radius:10px;padding:10px 14px;font-weight:700}
.pe-link span{font-family:var(--mono);font-size:.74rem;font-weight:400;opacity:.8}
.pe-link.next{background:var(--then);color:var(--then-ink);border-color:var(--then);text-align:right}
.saved{font-size:.8rem;color:var(--good);font-weight:700;min-height:1.2em}

footer.foot{padding-block:28px 50px;font-size:.86rem;color:var(--muted)}

@media (max-width:860px){
  .hero-grid,.two,.ad-studio,.cpu{grid-template-columns:1fr}
  .route{grid-template-columns:repeat(2,minmax(0,1fr))}
  .three,.trend,.drawn{grid-template-columns:repeat(2,minmax(0,1fr))}
  .mbs{grid-template-columns:1fr 1fr}
  .file .cols{grid-template-columns:1fr}
  .tt{grid-template-columns:1fr}
  .tt .mid{padding-top:0;order:3}
}
@media (max-width:560px){
  .three,.trend,.drawn,.wheel,.mbs,.outs{grid-template-columns:1fr}
  .lane{grid-template-columns:96px 1fr 64px;font-size:.8rem}
  .rub .r{grid-template-columns:1fr 1fr 1fr}
  .rub .r>div:first-child{grid-column:1/-1}
  .pe-links{grid-template-columns:1fr}
  .duel{grid-template-columns:1fr}
  .bits{gap:3px}.bit .d{font-size:1.7rem}
  nav.top .brand{display:none}
  .navbtn{padding:5px 9px}.navbtn .lg{display:none}.navbtn .sm{display:inline}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{
  nav.top,nav.partend,.skip,.toast,.noprint{display:none!important}
  body.print-poster *{visibility:hidden}
  body.print-poster .poster,body.print-poster .poster *{visibility:visible}
  body.print-poster .poster{position:absolute;left:0;top:0;width:100%;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body.print-capsule *{visibility:hidden}
  body.print-capsule #capPrint,body.print-capsule #capPrint *{visibility:visible}
  body.print-capsule #capPrint{position:absolute;left:0;top:0;width:100%;display:block!important}
}
</style>
</head>
