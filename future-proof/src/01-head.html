<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Future Proof</title>
<meta name="description" content="An interactive unit for ages 13 to 15: how computers think and talk, what the 1980s got right and wrong about the future, building smart tech with the BBC micro:bit, frontier technologies, and a five-year prediction sealed in a time capsule.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%226%22 fill=%22%23141B33%22/%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%229%22 fill=%22none%22 stroke=%22%23F2A93B%22 stroke-width=%223%22/%3E%3Cpath d=%22M16 10v6l4 3%22 stroke=%22%238B7BFF%22 stroke-width=%223%22 fill=%22none%22 stroke-linecap=%22round%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&family=VT323&display=swap">
<style>
/* Three timelines, three colours: PAST is amber, PRESENT is teal, FUTURE is violet. Ink-navy frames everything. */
:root{
  --bg:#EEF0F5; --paper:#FFFFFF; --ink:#141B33; --muted:#565F75; --line:#CDD2DE;
  --past:#B86A00; --past-soft:#FCEBD0; --past-hi:#F2A93B;
  --now:#0B7A75; --now-soft:#D3EFEC; --now-hi:#2EC4B6;
  --fut:#5B45D6; --fut-soft:#E6E1FF; --fut-hi:#8B7BFF;
  --good:#1E7A44; --good-soft:#DDF2E4; --bad:#B23A1C; --bad-soft:#F8E1DA; --mid:#8A6A00; --mid-soft:#FBF1C9;
  --tt-bg:#05060B; --tt-y:#FFE600; --tt-c:#00E5FF; --tt-g:#3CFF6B; --tt-w:#F4F4F4; --tt-m:#FF4FD8;
  --display:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --tt:"VT323","JetBrains Mono",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1120; --paper:#171C2E; --ink:#E7EAF4; --muted:#9CA4BA; --line:#2C3450;
  --past:#F2A93B; --past-soft:#3A2810; --past-hi:#F2A93B;
  --now:#43D2C4; --now-soft:#123532; --now-hi:#2EC4B6;
  --fut:#A497FF; --fut-soft:#251F4D; --fut-hi:#8B7BFF;
  --good:#5BC98A; --good-soft:#163525; --bad:#F08A6C; --bad-soft:#3D2018; --mid:#E9C64E; --mid-soft:#3A3212; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1120; --paper:#171C2E; --ink:#E7EAF4; --muted:#9CA4BA; --line:#2C3450;
  --past:#F2A93B; --past-soft:#3A2810; --past-hi:#F2A93B;
  --now:#43D2C4; --now-soft:#123532; --now-hi:#2EC4B6;
  --fut:#A497FF; --fut-soft:#251F4D; --fut-hi:#8B7BFF;
  --good:#5BC98A; --good-soft:#163525; --bad:#F08A6C; --bad-soft:#3D2018; --mid:#E9C64E; --mid-soft:#3A3212; color-scheme:dark}

*{box-sizing:border-box}
html{scroll-padding-top:64px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;-webkit-text-size-adjust:100%}
img,svg{max-width:100%}
[hidden]{display:none!important}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,h4{font-family:var(--display);line-height:1.08;text-wrap:balance;margin:0}
h2{font-size:clamp(1.8rem,4.5vw,2.6rem);font-weight:800;letter-spacing:-.01em}
h3{font-size:1.2rem;font-weight:700}
h4{font-size:1rem;font-weight:700}
p{margin:0}
ul,ol{margin:0;padding-left:1.2em}
li+li{margin-top:4px}
a{color:var(--now)}
button{font:inherit;cursor:pointer;color:inherit}
input,select,textarea{font:inherit;color:var(--ink)}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--fut-hi);outline-offset:2px}
.prose{display:grid;gap:12px;max-width:68ch}
.small{font-size:.86rem;color:var(--muted)}
.lede{color:var(--muted);max-width:64ch}
.mono{font-family:var(--mono)}
.past{color:var(--past)} .now{color:var(--now)} .fut{color:var(--fut)}
.tag{display:inline-block;font-family:var(--mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:99px;font-weight:600;vertical-align:middle}
.tag.past{background:var(--past-soft);color:var(--past)} .tag.now{background:var(--now-soft);color:var(--now)} .tag.fut{background:var(--fut-soft);color:var(--fut)}
.kw{display:inline-block;font-family:var(--mono);font-size:.76rem;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:1px 6px}

/* nav */
nav.top{position:sticky;top:0;z-index:20;background:#141B33;color:#F3F4FA;padding-top:env(safe-area-inset-top,0px)}
nav.top .wrap{display:flex;align-items:center;gap:14px;padding-block:10px}
nav.top .brand{font-family:var(--display);font-weight:800;white-space:nowrap;color:#F3F4FA;text-decoration:none;display:flex;align-items:center;gap:8px}
nav.top .brand i{width:10px;height:10px;border-radius:50%;background:linear-gradient(90deg,var(--past-hi) 0 33%,var(--now-hi) 33% 66%,var(--fut-hi) 66%)}
nav.top .links{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;min-width:0;flex:1}
nav.top .links::-webkit-scrollbar{display:none}
nav.top a{color:#F3F4FA;text-decoration:none;font-size:.86rem;padding:6px 10px;border-radius:99px;white-space:nowrap;opacity:.82}
nav.top a:hover{opacity:1;background:rgba(255,255,255,.12)}
nav.top a.proj{background:var(--fut-hi);color:#0D1120;opacity:1;font-weight:700}
nav.top .theme{background:none;border:1px solid rgba(255,255,255,.35);color:#F3F4FA;border-radius:99px;padding:5px 10px;font-size:.8rem;white-space:nowrap}

/* hero */
.hero{padding-block:48px 36px}
.hero-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:40px;align-items:center}
.eyebrow{font-family:var(--mono);font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--fut);font-weight:600}
.hero h1{font-size:clamp(2.7rem,8vw,5.4rem);font-weight:800;letter-spacing:-.03em;margin-top:10px}
.hero h1 span{background:linear-gradient(90deg,var(--past),var(--now) 50%,var(--fut));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .lede{font-size:1.15rem;margin-top:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.chip{font-family:var(--mono);font-size:.76rem;border:1px solid var(--line);border-radius:99px;padding:4px 10px;background:var(--paper);color:var(--muted)}

/* teletext screen (hero + retro bits) */
.tt{background:var(--tt-bg);color:var(--tt-w);font-family:var(--tt);font-size:1.32rem;line-height:1.05;border-radius:14px;padding:16px 16px 18px;box-shadow:0 0 0 8px #1B2033,0 18px 40px -18px rgba(0,0,0,.6);position:relative;overflow:hidden}
.tt::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px);pointer-events:none}
.tt .hdr{display:flex;justify-content:space-between;color:var(--tt-w);gap:8px}
.tt .bar{background:var(--tt-c);color:var(--tt-bg);padding:2px 8px;margin:8px 0;display:flex;justify-content:space-between}
.tt .y{color:var(--tt-y)} .tt .c{color:var(--tt-c)} .tt .g{color:var(--tt-g)} .tt .m{color:var(--tt-m)}
.tt .row{display:flex;justify-content:space-between;gap:10px;padding:2px 0}
.tt .row span:last-child{white-space:nowrap}
.tt .foot{display:grid;grid-template-columns:repeat(4,1fr);margin-top:12px;text-align:center;font-size:1.1rem}
.tt .foot span:nth-child(1){background:#E0261B;color:#fff} .tt .foot span:nth-child(2){background:#21C04B;color:#000} .tt .foot span:nth-child(3){background:var(--tt-y);color:#000} .tt .foot span:nth-child(4){background:var(--tt-c);color:#000}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.blink{animation:none}}

/* route */
.route{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin-top:8px}
.route a{display:grid;gap:4px;align-content:start;text-decoration:none;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-top:4px solid var(--line);border-radius:8px;padding:10px;font-size:.84rem}
.route a:hover{border-color:var(--ink)}
.route a b{font-family:var(--display);font-size:.98rem;line-height:1.15}
.route a > span{font-family:var(--mono);font-size:.68rem;color:var(--muted);letter-spacing:.06em}
.route a.r-now{border-top-color:var(--now)} .route a.r-past{border-top-color:var(--past)} .route a.r-fut{border-top-color:var(--fut)}
.route a.p{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.route a.p span{color:var(--fut-hi)}
.howto{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:22px}
.howto div{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:.92rem}
.howto b{font-family:var(--display);display:block;font-size:1.02rem;margin-bottom:4px}

/* parts and sections */
.part{color:#F3F4FA;margin-top:24px;background:var(--ink)}
:root .part{background:#141B33}
.part .wrap{padding-block:40px;display:grid;gap:10px}
.part .num{font-family:var(--mono);font-size:.8rem;letter-spacing:.14em}
.part.p-now .num{color:var(--now-hi)} .part.p-past .num{color:var(--past-hi)} .part.p-fut .num{color:var(--fut-hi)}
.part.p-now{box-shadow:inset 0 6px 0 var(--now-hi)} .part.p-past{box-shadow:inset 0 6px 0 var(--past-hi)} .part.p-fut{box-shadow:inset 0 6px 0 var(--fut-hi)}
.part h2{color:#F3F4FA}
.part p{color:#C2C7D8;max-width:62ch}
section.block{padding-block:48px;border-top:1px solid var(--line)}
section.block.first{border-top:0}
.sec-head{display:grid;gap:10px;margin-bottom:24px}
.mission{font-family:var(--mono);font-size:.8rem;color:var(--muted)}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:20px;min-width:0}
.panel h3{margin-bottom:10px;font-size:1.05rem}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
.stack{display:grid;gap:12px}
.row-btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1.5px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:8px;padding:9px 14px;font-weight:700;font-size:.94rem;line-height:1.2}
.btn:hover{background:var(--ink);color:var(--bg)}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.primary:hover{background:var(--fut);border-color:var(--fut);color:#fff}
.btn.sm{padding:6px 10px;font-size:.84rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.task{border-left:4px solid var(--fut);padding:12px 14px;background:var(--paper);border-radius:0 8px 8px 0;margin-top:20px;max-width:78ch}
.task.t-past{border-left-color:var(--past)} .task.t-now{border-left-color:var(--now)}
.task b{font-family:var(--display)}
.key{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:16px}
.key div{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:12px;font-size:.9rem}
.key b{font-family:var(--display);display:block;font-size:1rem;margin-bottom:2px}
.fbbox{margin-top:12px;padding:12px;border-radius:8px;background:var(--now-soft);font-size:.95rem}
.fbbox.good{background:var(--good-soft)} .fbbox.bad{background:var(--bad-soft)}
label.fld{display:grid;gap:4px;font-size:.88rem;font-weight:700}
label.fld span.small{font-weight:400}
textarea,input[type=text],input[type=number],select{width:100%;padding:9px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg)}
textarea{min-height:84px;resize:vertical;line-height:1.45}
input[type=range]{width:100%;accent-color:var(--now)}
details.more{margin-top:14px;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
details.more summary{cursor:pointer;font-weight:700}
details.more[open] summary{margin-bottom:8px}
.saved{font-family:var(--mono);font-size:.74rem;color:var(--good)}

/* video cards */
.watch{margin-top:24px}
.watch .wh{font-family:var(--mono);font-size:.76rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.vids{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
a.vid{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;align-items:start;text-decoration:none;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px}
a.vid:hover{border-color:var(--ink)}
a.vid .play{width:56px;height:56px;border-radius:8px;background:#141B33;display:grid;place-items:center;position:relative}
a.vid .play::before{content:"";border-left:16px solid var(--past-hi);border-top:10px solid transparent;border-bottom:10px solid transparent;margin-left:4px}
a.vid.v-now .play::before{border-left-color:var(--now-hi)} a.vid.v-fut .play::before{border-left-color:var(--fut-hi)}
a.vid .yr{position:absolute;bottom:3px;left:0;right:0;text-align:center;font-family:var(--mono);font-size:.6rem;color:#C2C7D8}
a.vid b{font-family:var(--display);font-size:1rem;display:block;line-height:1.2}
a.vid .by{font-family:var(--mono);font-size:.72rem;color:var(--muted)}
a.vid .use{font-size:.85rem;margin-top:4px;display:block}

/* tabs */
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:16px;scrollbar-width:thin}
.tabs button{border:1.5px solid var(--line);background:var(--paper);border-radius:99px;padding:8px 14px;white-space:nowrap;font-weight:700;font-size:.9rem}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* ---------- PART 1: CPU ---------- */
.cpu-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:20px;align-items:start}
.machine{background:#141B33;color:#E7EAF4;border-radius:14px;padding:16px;display:grid;gap:12px}
.machine .lbl{font-family:var(--mono);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:#9CA4BA}
.cpu-box{border:2px solid #3B4566;border-radius:10px;padding:12px;display:grid;gap:10px;position:relative}
.cpu-box.active{border-color:var(--now-hi)}
.regs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.reg{background:#0D1120;border:1.5px solid #3B4566;border-radius:8px;padding:6px 4px;text-align:center;transition:border-color .2s,background .2s}
.reg b{display:block;font-family:var(--mono);font-size:.68rem;color:#9CA4BA;letter-spacing:.06em}
.reg span{font-family:var(--mono);font-size:1rem;font-weight:600;font-variant-numeric:tabular-nums}
.reg.flash{border-color:var(--past-hi);background:#2A2210}
.units{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.unit{border:1.5px dashed #3B4566;border-radius:8px;padding:6px 8px;font-size:.8rem;text-align:center}
.unit.on{border-style:solid;border-color:var(--now-hi);background:#0E2E2C}
.buses{display:flex;gap:6px;flex-wrap:wrap}
.bus{font-family:var(--mono);font-size:.7rem;padding:3px 8px;border-radius:99px;border:1px solid #3B4566;color:#9CA4BA}
.bus.on{background:var(--past-hi);color:#141B33;border-color:var(--past-hi);font-weight:600}
.ram{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.cell{background:#0D1120;border:1.5px solid #2C3450;border-radius:6px;padding:4px 5px;font-family:var(--mono);font-size:.72rem;display:grid;gap:1px;min-width:0}
.cell i{font-style:normal;color:#6F7896;font-size:.62rem}
.cell span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell.pc{border-color:var(--now-hi)}
.cell.touch{border-color:var(--past-hi);background:#2A2210}
.phase{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.phase span{text-align:center;font-family:var(--mono);font-size:.74rem;padding:6px;border-radius:6px;background:#0D1120;color:#6F7896;letter-spacing:.06em}
.phase span.on{background:var(--now-hi);color:#0D1120;font-weight:600}
.out{font-family:var(--tt);font-size:1.4rem;color:var(--tt-g);background:#05060B;border-radius:8px;padding:6px 10px;min-height:38px;word-break:break-all}
.narr{background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--now);border-radius:0 8px 8px 0;padding:12px 14px;min-height:96px;font-size:.95rem}
.narr b{font-family:var(--display)}
.asm{font-family:var(--mono);font-size:.84rem;min-height:210px;line-height:1.5}
.isa{font-size:.82rem}
.isa td,.isa th{padding:3px 6px}

/* memory hierarchy */
.mem-list{display:grid;gap:8px}
.mem{display:grid;grid-template-columns:150px minmax(0,1fr) 112px;gap:10px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 12px;text-align:left;color:var(--ink)}
.mem:hover{border-color:var(--ink)}
.mem b{font-family:var(--display);font-size:1rem;display:block}
.mem small{font-size:.75rem;color:var(--muted);display:block}
.mem .track{height:14px;background:var(--bg);border-radius:7px;overflow:hidden}
.mem .fill{height:100%;width:0;background:var(--now);border-radius:7px}
.mem .t{font-family:var(--mono);font-size:.82rem;text-align:right;font-variant-numeric:tabular-nums}

/* packet journey */
.hops{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.hop{border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:10px;text-align:left;display:grid;gap:4px;color:var(--ink)}
.hop:hover{border-color:var(--ink)}
.hop .ic{font-size:1.4rem;line-height:1}
.hop b{font-family:var(--display);font-size:.95rem}
.hop span{font-size:.75rem;color:var(--muted)}
.hop.used{opacity:.35}
.route-built{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:48px;padding:10px;border:1.5px dashed var(--line);border-radius:10px;background:var(--paper)}
.route-built .rb{font-size:.84rem;font-weight:700;background:var(--now-soft);color:var(--ink);border-radius:99px;padding:5px 10px}
.route-built .rb.bad{background:var(--bad-soft)}
.route-built .arr{color:var(--muted)}
.net{width:100%;height:auto;display:block;background:var(--paper);border:1px solid var(--line);border-radius:10px}
.net text{font-family:var(--body);fill:var(--ink);font-size:12px}
.net .sub{font-family:var(--mono);font-size:9.5px;fill:var(--muted)}
.net .link{stroke:var(--line);stroke-width:3}
.net .link.down{stroke:var(--bad);stroke-dasharray:6 5}
.net .node{fill:var(--bg);stroke:var(--ink);stroke-width:1.5}
.net .node.down{stroke:var(--bad);fill:var(--bad-soft)}
.net .pkt{stroke:var(--paper);stroke-width:1.5}
.reasm{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.reasm span{font-family:var(--mono);font-size:.8rem;padding:4px 8px;border-radius:6px;background:var(--bg);border:1px solid var(--line)}
.reasm span.in{background:var(--now-soft);border-color:var(--now)}

/* bandwidth */
.bw-grid{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:20px;align-items:start}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{border:1.5px solid var(--line);background:var(--paper);border-radius:99px;padding:6px 12px;font-size:.86rem;font-weight:700}
.opt[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bwrows{display:grid;gap:8px}
.bwr{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px;align-items:center;font-size:.86rem}
.bwr b{font-family:var(--display);font-size:.95rem;display:block}
.bwr small{color:var(--muted);font-size:.74rem}
.bwr .track{height:22px;background:var(--bg);border-radius:6px;overflow:hidden;position:relative}
.bwr .fill{height:100%;border-radius:6px;transition:width .5s}
.bwr .val{position:absolute;left:8px;top:50%;transform:translateY(-50%);font-family:var(--mono);font-size:.76rem;font-weight:600;white-space:nowrap;color:var(--ink)}

/* ---------- PART 2: retro ---------- */
.pred-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.pred{background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:grid;align-content:start}
.pred .ph{background:#05060B;color:var(--tt-w);font-family:var(--tt);padding:10px 12px;font-size:1.2rem;line-height:1.05;display:grid;gap:4px}
.pred .ph .y{color:var(--tt-y)} .pred .ph .c{color:var(--tt-c)}
.pred .pb{padding:12px 14px;display:grid;gap:10px}
.pred .src{font-size:.78rem;color:var(--muted)}
.vote{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.vote button{border:1.5px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 4px;font-size:.82rem;font-weight:700}
.vote button:hover{border-color:var(--ink)}
.vote button.pick{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.verdict{border-radius:8px;padding:10px 12px;font-size:.9rem;display:grid;gap:6px}
.verdict.hit{background:var(--good-soft)} .verdict.miss{background:var(--bad-soft)} .verdict.part{background:var(--mid-soft)}
.verdict b{font-family:var(--display)}
.verdict dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;margin:0;font-size:.84rem}
.verdict dt{font-family:var(--mono);font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding-top:2px}
.verdict dd{margin:0}
.score-strip{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px;font-size:.92rem}
.score-strip b{font-family:var(--display);font-size:1.3rem}
.myths{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.myth{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:10px;align-content:start}
.myth q{font-family:var(--display);font-size:1.15rem;font-weight:700;quotes:"“" "”"}
.myth .who{font-family:var(--mono);font-size:.76rem;color:var(--muted)}
.spec{display:grid;gap:14px}
.spec-row{display:grid;grid-template-columns:130px minmax(0,1fr);gap:12px;align-items:center}
.spec-row > b{font-family:var(--display);font-size:.95rem}
.spec-bars{display:grid;gap:5px}
.sb{display:grid;grid-template-columns:120px minmax(0,1fr) 92px;gap:8px;align-items:center;font-size:.8rem}
.sb .track{height:12px;background:var(--bg);border-radius:6px;overflow:hidden}
.sb .fill{height:100%;border-radius:6px;transition:width .6s}
.sb .v{font-family:var(--mono);font-size:.74rem;text-align:right;font-variant-numeric:tabular-nums}
.matrix{width:100%;border-collapse:collapse;font-size:.88rem;min-width:720px}
.matrix th{font-family:var(--mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px;border-bottom:2px solid var(--line);vertical-align:bottom}
.matrix td{border-bottom:1px solid var(--line);padding:6px;vertical-align:top}
.matrix textarea{min-height:58px;font-size:.86rem;padding:6px 8px}
.matrix select{font-size:.84rem;padding:6px}
.tablewrap{overflow-x:auto}
table.plain{border-collapse:collapse;width:100%;font-size:.88rem}
table.plain th,table.plain td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.plain th{font-family:var(--mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.casefile{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.timeline{display:grid;gap:0;border-left:3px solid var(--past);margin-left:6px}
.timeline div{position:relative;padding:0 0 14px 18px;font-size:.92rem}
.timeline div::before{content:"";position:absolute;left:-8px;top:5px;width:13px;height:13px;border-radius:50%;background:var(--paper);border:3px solid var(--past)}
.timeline b{font-family:var(--mono);font-size:.78rem;color:var(--past);display:block}

/* ---------- PART 3: micro:bit ---------- */
.ipo{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.ipo div{background:var(--paper);border:1px solid var(--line);border-top:4px solid var(--now);border-radius:10px;padding:12px;font-size:.9rem}
.ipo b{font-family:var(--display);font-size:1.05rem;display:block}
.ipo span{font-family:var(--mono);font-size:.7rem;color:var(--muted);letter-spacing:.08em}
.mb-stage{display:grid;grid-template-columns:minmax(0,1fr) 110px minmax(0,1fr);gap:12px;align-items:center}
.mb-col{display:grid;gap:10px;justify-items:center;min-width:0}
.mb-name{font-family:var(--mono);font-size:.76rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center}
.mb{width:100%;max-width:230px;aspect-ratio:1.18/1;background:#1A1A1A;border-radius:18px;position:relative;padding:14% 18% 18%;box-shadow:0 10px 24px -14px rgba(0,0,0,.7);display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:8%}
.mb .ab{width:22px;height:22px;border-radius:50%;background:#3A3A3A;border:3px solid #0E0E0E;color:#bbb;font-family:var(--mono);font-size:.62rem;display:grid;place-items:center;padding:0}
.mb .ab:hover{background:#555}
.mb .ab:active{transform:scale(.92)}
.leds{display:grid;grid-template-columns:repeat(5,1fr);gap:16%;aspect-ratio:1/1}
.led{border-radius:2px;background:#3B1A1A;width:100%;aspect-ratio:1/2.2;justify-self:center;align-self:center;transition:background .15s,box-shadow .15s}
.led.on{background:#FF2A1A;box-shadow:0 0 8px 2px rgba(255,60,30,.75)}
.mb .logo{position:absolute;top:5%;left:50%;transform:translateX(-50%);width:26px;height:12px;border:2px solid #777;border-radius:8px}
.mb .edge{position:absolute;bottom:0;left:6%;right:6%;height:12%;background:repeating-linear-gradient(90deg,#C9A43A 0 6px,#1A1A1A 6px 9px);border-radius:0 0 4px 4px;opacity:.9}
.mb .grp{position:absolute;top:6%;right:7%;font-family:var(--mono);font-size:.62rem;color:#999}
.mb.shake{animation:shake .35s}
@keyframes shake{20%{transform:translate(-4px,1px) rotate(-2deg)}40%{transform:translate(4px,-1px) rotate(2deg)}60%{transform:translate(-3px,0) rotate(-1deg)}80%{transform:translate(3px,0)}}
@media (prefers-reduced-motion:reduce){.mb.shake{animation:none}}
.air{position:relative;height:90px;display:grid;place-items:center}
.air .wave{font-family:var(--mono);font-size:.7rem;color:var(--muted);text-align:center}
.air .msg{position:absolute;top:30px;left:0;font-family:var(--mono);font-size:.74rem;background:var(--now);color:#fff;border-radius:99px;padding:3px 8px;white-space:nowrap;opacity:0}
.air .msg.go{animation:fly 1s ease-in-out forwards}
.air .msg.lost{background:var(--bad)}
@keyframes fly{0%{left:-10%;opacity:0}15%{opacity:1}85%{opacity:1}100%{left:70%;opacity:0}}
.mb-ctrls{display:grid;gap:10px;width:100%}
.ctl{display:grid;grid-template-columns:110px minmax(0,1fr) 52px;gap:8px;align-items:center;font-size:.86rem}
.ctl output{font-family:var(--mono);font-size:.8rem;text-align:right}
.ctl.short{grid-template-columns:110px minmax(0,1fr)}
.mb-log{font-family:var(--mono);font-size:.74rem;background:#141B33;color:#BFF5E8;border-radius:8px;padding:10px 12px;height:150px;overflow-y:auto;line-height:1.6}
.mb-log .w{color:var(--past-hi)} .mb-log .e{color:#FF9C8A} .mb-log .s{color:#A497FF}
.code{font-family:var(--mono);font-size:.8rem;background:#141B33;color:#E7EAF4;border-radius:10px;padding:14px;overflow-x:auto;line-height:1.55;white-space:pre;margin:0;tab-size:4}
.code .k{color:#FF9EC4} .code .f{color:#7FE3D8} .code .n{color:#F2C46B} .code .s{color:#B8F28B} .code .c{color:#8A93AD;font-style:italic}
.codehead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.kit{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.kit div{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:.88rem}
.kit b{font-family:var(--display);display:block}
.steps{counter-reset:s;display:grid;gap:10px;list-style:none;padding:0}
.steps li{counter-increment:s;display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:start;margin:0}
.steps li::before{content:counter(s);width:30px;height:30px;border-radius:50%;background:var(--now);color:#fff;display:grid;place-items:center;font-family:var(--mono);font-size:.82rem;font-weight:600}
.check-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.chk{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:10px;align-content:start}
.chk .q{font-weight:700}
.chk .ans{display:flex;gap:6px;flex-wrap:wrap}
.chk .ans button{flex:1;border:1.5px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 6px;font-size:.84rem;font-weight:700;min-width:90px}
.chk.right{border-color:var(--good);background:var(--good-soft)}
.chk.wrong{border-color:var(--bad);background:var(--bad-soft)}

/* ---------- PART 4: frontier ---------- */
.pillar{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:20px;align-items:start}
.pillar .facts{display:grid;gap:10px}
.fact{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px}
.fact .fl{font-family:var(--mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--fut);font-weight:600;margin-bottom:4px}
.hype{display:grid;gap:8px}
.hype-scale{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.hype-scale button{border:1.5px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 2px;font-size:.74rem;font-weight:700;line-height:1.15}
.hype-scale button.pick{background:var(--fut);color:#fff;border-color:var(--fut)}
.qubit-grid{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:20px;align-items:start}
.coin{width:120px;height:120px;border-radius:50%;margin:8px auto;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:2.4rem;background:conic-gradient(var(--fut) 0 var(--p,50%),var(--now) var(--p,50%) 100%);color:#fff;transition:transform .5s}
.coin.spin{animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotateY(360deg)}}
@media (prefers-reduced-motion:reduce){.coin.spin{animation:none}}
.tally{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}
.tally div{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px;text-align:center}
.tally b{display:block;font-family:var(--display);font-size:1.8rem}
.heads{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.headline{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:10px;align-content:start}
.headline .hl{font-family:var(--display);font-weight:700;font-size:1.08rem;line-height:1.2}
.headline .outlet{font-family:var(--mono);font-size:.72rem;color:var(--muted)}
.headline .ans{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.headline .ans button{border:1.5px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 4px;font-size:.84rem;font-weight:700}
.headline.right{border-color:var(--good);background:var(--good-soft)}
.headline.wrong{border-color:var(--bad);background:var(--bad-soft)}
.organiser{display:grid;gap:14px}
.reliab{display:grid;gap:6px}
.reliab label{display:flex;gap:8px;align-items:flex-start;font-size:.9rem}
.reliab input{margin-top:4px;accent-color:var(--fut)}

/* ---------- PART 5: pitch + capsule ---------- */
.pitch-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.pitchcard{background:#141B33;color:#E7EAF4;border-radius:14px;padding:20px;display:grid;gap:12px;position:sticky;top:70px}
.pitchcard .pk{font-family:var(--mono);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--fut-hi)}
.pitchcard h3{font-size:1.6rem;color:#fff}
.pitchcard p{font-size:.92rem;color:#C2C7D8}
.pitchcard .sect b{font-family:var(--mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--now-hi);display:block;margin-bottom:2px}
.pitchcard .conf{height:10px;border-radius:5px;background:#2C3450;overflow:hidden}
.pitchcard .conf i{display:block;height:100%;background:linear-gradient(90deg,var(--past-hi),var(--fut-hi))}
.links-check{display:grid;gap:6px}
.links-check label{display:flex;gap:8px;align-items:flex-start;font-size:.9rem;font-weight:400}
.links-check input{margin-top:4px;accent-color:var(--fut)}
.capsule{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.vault{background:radial-gradient(circle at 30% 20%,#2A2F57,#141B33 70%);color:#E7EAF4;border-radius:16px;padding:24px;display:grid;gap:14px;text-align:center;min-height:300px;align-content:center}
.vault .dial{width:120px;height:120px;border-radius:50%;margin:0 auto;border:8px solid #3B4566;display:grid;place-items:center;font-family:var(--mono);font-size:.9rem;position:relative;background:#0D1120}
.vault .dial::before{content:"";position:absolute;inset:10px;border-radius:50%;border:2px dashed #3B4566}
.vault.sealed .dial{border-color:var(--fut-hi);box-shadow:0 0 30px -4px var(--fut-hi)}
.vault .when{font-family:var(--tt);font-size:2rem;color:var(--tt-y)}
.vault p{color:#C2C7D8;font-size:.92rem}

/* quiz */
.quiz{display:grid;gap:14px;max-width:780px}
.qz{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px}
.qz .qq{font-weight:700;margin-bottom:10px}
.qz .qo{display:grid;gap:6px}
.qz .qo button{text-align:left;border:1.5px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 12px}
.qz .qo button:hover{border-color:var(--ink)}
.qz .qo button.right{border-color:var(--good);background:var(--good-soft)}
.qz .qo button.wrong{border-color:var(--bad);background:var(--bad-soft)}
.qz .qe{margin-top:8px;font-size:.9rem;color:var(--muted)}
.qscore{font-family:var(--display);font-size:1.3rem;font-weight:800}

/* project */
.proj-hero{background:linear-gradient(135deg,#141B33 0%,#2A1F6B 100%);color:#F3F4FA}
.proj-hero .wrap{padding-block:48px;display:grid;gap:12px}
.proj-hero .num{font-family:var(--mono);font-size:.8rem;letter-spacing:.14em;color:var(--fut-hi)}
.proj-hero h2{color:#fff;font-size:clamp(2rem,5vw,3.2rem)}
.proj-hero p{color:#C9CBEA;max-width:64ch}
.paths{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.path{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:18px;display:grid;gap:8px;align-content:start}
.path .pl{font-family:var(--mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--fut);font-weight:600}
.stages{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.stage{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:6px;align-content:start;font-size:.9rem}
.stage .sn{font-family:var(--mono);font-size:.72rem;color:var(--fut);letter-spacing:.1em}
.stage b{font-family:var(--display);font-size:1.02rem}
.roles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.role{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px;font-size:.9rem;display:grid;gap:4px;align-content:start}
.role b{font-family:var(--display);font-size:1.02rem}
.rubric{min-width:680px}
.rubric td:first-child{font-weight:700;font-family:var(--display)}
.planner{display:grid;gap:12px}
.plan-check{display:grid;gap:6px}
.plan-check label{display:flex;gap:8px;align-items:flex-start;font-size:.92rem;font-weight:400}
.plan-check input{margin-top:4px;accent-color:var(--fut)}
.teacher .panel{font-size:.94rem}
.teacher ul,.teacher ol{font-size:.92rem}
footer{padding-block:32px 48px;color:var(--muted);font-size:.86rem;border-top:1px solid var(--line)}

.track,.track .fill{display:block}

/* responsive */
@media (max-width:900px){
  .hero-grid,.two,.cpu-grid,.bw-grid,.casefile,.pillar,.qubit-grid,.pitch-grid,.capsule,.paths{grid-template-columns:minmax(0,1fr)}
  .route{grid-template-columns:repeat(4,minmax(0,1fr))}
  .three,.howto{grid-template-columns:minmax(0,1fr)}
  .stages{grid-template-columns:repeat(2,minmax(0,1fr))}
  .roles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ipo{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pitchcard{position:static}
  .hero .tt{max-width:440px}
}
@media (max-width:600px){
  body{font-size:16px}
  .route{grid-template-columns:repeat(2,minmax(0,1fr))}
  .mb-stage{grid-template-columns:minmax(0,1fr) 60px minmax(0,1fr);gap:6px}
  .mb{padding:14% 12% 18%;gap:5%}
  .mb .ab{width:18px;height:18px;font-size:.55rem;border-width:2px}
  .regs{grid-template-columns:repeat(3,minmax(0,1fr))}
  .mem{grid-template-columns:minmax(0,1fr) 90px}
  .mem .track{grid-column:1/-1;grid-row:2}
  .bwr{grid-template-columns:minmax(0,1fr)}
  .sb{grid-template-columns:96px minmax(0,1fr) 78px}
  .spec-row{grid-template-columns:minmax(0,1fr)}
  .ctl{grid-template-columns:90px minmax(0,1fr) 46px}
  .ctl.short{grid-template-columns:90px minmax(0,1fr)}
  .stages,.roles,.ipo{grid-template-columns:minmax(0,1fr)}
  .tt{font-size:1.05rem;padding:12px}
  section.block{padding-block:36px}
  .hype-scale button{font-size:.66rem}
}
@media print{nav.top,.btn,.tabs{display:none!important} .part,.proj-hero{background:#fff!important;color:#000!important;box-shadow:none} .part h2,.proj-hero h2,.part p{color:#000!important}}
</style>
</head>
